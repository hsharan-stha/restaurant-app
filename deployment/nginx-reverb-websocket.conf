# Snippet for Nginx (Ubuntu): WebSocket proxy to Laravel Reverb on localhost.
# Replace server_name, root, PHP upstream, and ssl_* paths with your site config.
#
# Reverb default port: REVERB_SERVER_PORT=8080 (see .env)
# Client connects with REVERB_HOST / REVERB_PORT matching this proxy.

upstream php-fpm-restaurant {
    server unix:/run/php/php8.2-fpm.sock;
}

server {
    listen 443 ssl http2;
    server_name restaurant.example.com;

    root /var/www/RestaurantApp/public;
    index index.php;

    # ... ssl_certificate, ssl_certificate_key ...

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm-restaurant;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Laravel Echo / Reverb (Pusher-compatible WebSocket endpoint)
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8080;
    }
}
