; Laravel Reverb — copy to /etc/supervisor/conf.d/restaurant-reverb.conf
; Adjust paths and user for your VPS.

[program:restaurant-reverb]
process_name=%(program_name)s
command=php /var/www/RestaurantApp/artisan reverb:start --debug
directory=/var/www/RestaurantApp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/RestaurantApp/storage/logs/reverb.log
stopwaitsecs=10
